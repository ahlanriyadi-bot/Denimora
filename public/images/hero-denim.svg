<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" width="100%" height="100%">
  <defs>
    <linearGradient id="heroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1128" />
      <stop offset="40%" stop-color="#102542" />
      <stop offset="100%" stop-color="#1b3a6b" />
    </linearGradient>
    <pattern id="stitchGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M0 20 L40 20" stroke="#f59e0b" stroke-width="1" stroke-dasharray="4,4" opacity="0.15"/>
      <path d="M20 0 L20 40" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4,4" opacity="0.1"/>
    </pattern>
  </defs>
  <rect width="1200" height="650" fill="url(#heroGrad)"/>
  <rect width="1200" height="650" fill="url(#stitchGrid)"/>
  
  <!-- Stylized Decorative Denim Elements -->
  <g opacity="0.12" transform="translate(700, 50)">
    <circle cx="200" cy="250" r="280" fill="none" stroke="#60a5fa" stroke-width="8"/>
    <circle cx="200" cy="250" r="220" fill="none" stroke="#f59e0b" stroke-width="4" stroke-dasharray="10,8"/>
    <path d="M-50 150 Q200 -50 450 150 Q550 400 200 550 Z" fill="#3b82f6"/>
  </g>

  <!-- Hero Visual Badge Card -->
  <g transform="translate(750, 100)">
    <rect x="0" y="0" width="380" height="460" rx="24" fill="#0f172a" fill-opacity="0.7" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
    <rect x="15" y="15" width="350" height="430" rx="18" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="6,4"/>
    
    <!-- Big Jacket/Jean graphic -->
    <g transform="translate(190, 180)">
      <circle cx="0" cy="0" r="100" fill="#1e3a8a" opacity="0.4"/>
      <!-- Jacket outline -->
      <path d="M-60 -50 C-40 -65, 40 -65, 60 -50 L95 10 L65 25 L45 -5 L45 95 L-45 95 L-45 -5 L-65 25 L-95 10 Z" fill="#60a5fa" opacity="0.9"/>
      <path d="M0 -50 L0 95" stroke="#fbbf24" stroke-width="2" stroke-dasharray="4,3"/>
      <rect x="-35" y="70" width="70" height="20" rx="3" fill="#854d0e"/>
      <text x="0" y="84" fill="#fef08a" font-family="'Courier New', monospace" font-size="8" font-weight="bold" text-anchor="middle">DENIMORA RAW</text>
    </g>

    <text x="190" y="340" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">Timeless Denim Craft</text>
    <text x="190" y="365" fill="#94a3b8" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" text-anchor="middle">Crafted by PT RYD Denim</text>
    
    <rect x="115" y="390" width="150" height="36" rx="18" fill="#2563eb"/>
    <text x="190" y="413" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" letter-spacing="1">AUTHENTIC 2026</text>
  </g>
</svg>