<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>
    <pattern id="denimTexture" width="6" height="6" patternUnits="userSpaceOnUse">
      <path d="M0 6 L6 0 M0 0 L6 6" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="700" fill="url(#bgGrad)" />
  <rect width="600" height="700" fill="url(#denimTexture)" />

  <!-- Stitch border lines -->
  <rect x="25" y="25" width="550" height="650" rx="16" fill="none" stroke="#60a5fa" stroke-width="2" stroke-dasharray="6,4" opacity="0.6" />

  <!-- Center Apparel Silhouette / Graphic -->
  <g transform="translate(100, 100)" filter="url(#shadow)">
    <!-- Card Inner -->
    <rect x="20" y="20" width="360" height="380" rx="16" fill="#1e293b" fill-opacity="0.5" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    
    <!-- Graphic Illustration -->
    <circle cx="200" cy="180" r="110" fill="#60a5fa" fill-opacity="0.12" />
    <path d="M140 130 C160 110, 240 110, 260 130 L290 200 L250 215 L235 175 L235 300 L165 300 L165 175 L150 215 L110 200 Z" fill="#60a5fa" opacity="0.85"/>
    <path d="M200 130 L200 290" stroke="#fbbf24" stroke-width="2" stroke-dasharray="4,3" opacity="0.8"/>
    
    <!-- Leather patch badge -->
    <rect x="150" y="280" width="100" height="34" rx="4" fill="#854d0e" stroke="#ca8a04" stroke-width="1.5" stroke-dasharray="3,2"/>
    <text x="200" y="302" fill="#fef08a" font-family="'Courier New', monospace" font-size="11" font-weight="bold" text-anchor="middle" letter-spacing="2">DENIMORA</text>
  </g>

  <!-- Brand Label & Badge -->
  <rect x="42" y="42" width="120" height="30" rx="15" fill="#60a5fa" fill-opacity="0.2" stroke="#60a5fa" stroke-width="1"/>
  <text x="102" y="62" fill="#60a5fa" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1">DENIMORA</text>

  <!-- Bottom Info Block -->
  <g transform="translate(50, 540)">
    <text x="0" y="30" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800">DENIMORA Product</text>
    <text x="0" y="60" fill="#94a3b8" font-family="'Segoe UI', Roboto, sans-serif" font-size="14">Quality Handcrafted Denim</text>
    <line x1="0" y1="80" x2="500" y2="80" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <text x="500" y="105" fill="#e2e8f0" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" text-anchor="end" letter-spacing="1">AUTHENTIC DENIM CRAFT</text>
  </g>
</svg>